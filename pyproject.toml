[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-data-scraper"
version = "1.0.0"
description = "Product-page URL scraper that extracts variant-level product data into Excel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "playwright>=1.40.0",
  "pandas>=2.1.0",
  "openpyxl>=3.1.0",
  "urllib3>=2.0.0",
  "click>=8.1.0",
  "rich>=13.7.0",
  "python-dateutil>=2.8.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
product-scraper = "product_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["product_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
