name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maxtrone
          POSTGRES_PASSWORD: maxtrone
          POSTGRES_DB: maxtrone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxtrone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://maxtrone:maxtrone@localhost:5432/maxtrone?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AI_PROVIDER: mock
      MESSAGING_PROVIDER: mock
      TTS_PROVIDER: mock
      VOICE_CALL_PROVIDER: mock
      PAYMENT_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm typecheck
      - run: pnpm test
