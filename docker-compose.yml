services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxtrone
      POSTGRES_PASSWORD: maxtrone
      POSTGRES_DB: maxtrone
    ports:
      - "5432:5432"
    volumes:
      - maxtrone_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxtrone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - maxtrone_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maxtrone_pg:
  maxtrone_redis:
