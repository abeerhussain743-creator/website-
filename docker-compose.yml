services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - meridian_mongo:/data/db
    ports:
      - '27017:27017'

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/meridian
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-to-32chars-min}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      SEED_ON_START: ${SEED_ON_START:-true}
      TRUST_PROXY: 'true'
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}

volumes:
  meridian_mongo:
